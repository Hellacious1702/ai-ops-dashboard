<!DOCTYPE html>
<html lang="en" hx-headers='{"X-Requested-With": "XMLHttpRequest"}'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.app_name }} - AI Ops Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/ws.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .chart-container { position: relative; height: 300px; }
        .metric-card { transition: all 0.2s ease; }
        .metric-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.1); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-healthy { background-color: #10b981; }
        .status-warning { background-color: #f59e0b; }
        .status-critical { background-color: #ef4444; }
        .badge { padding: 0.25rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .badge-high { background-color: #fef2f2; color: #dc2626; }
        .badge-medium { background-color: #fffbeb; color: #d97706; }
        .badge-low { background-color: #f0fdf4; color: #16a34a; }
        .badge-critical { background-color: #fef2f2; color: #dc2626; }
        .sidebar-link { transition: all 0.15s ease; }
        .sidebar-link:hover { background-color: rgba(255,255,255,0.1); }
        .sidebar-link.active { background-color: rgba(255,255,255,0.2); border-left: 3px solid #3b82f6; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-slow { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.8); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 dark:bg-gray-950 border-r border-gray-700 flex flex-col hidden lg:flex">
            <div class="p-4 border-b border-gray-700">
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                    AI Ops Dashboard
                </h1>
                <p class="text-xs text-gray-400 mt-1">LLM Observability & Cost Optimization</p>
            </div>
            
            <nav class="flex-1 p-4 space-y-1 overflow-y-auto scrollbar-thin">
                <a href="/" class="sidebar-link active flex items-center gap-3 px-3 py-2 rounded-lg text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                    </svg>
                    Overview
                </a>
                <a href="#metrics" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:text-white" hx-get="/partials/metrics/breakdown" hx-target="#metrics-content" hx-swap="innerHTML">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                    Metrics
                </a>
                <a href="#recommendations" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:text-white" hx-get="/partials/recommendations/list" hx-target="#recommendations-content" hx-swap="innerHTML">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                    </svg>
                    Recommendations
                </a>
                <a href="#alerts" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:text-white" hx-get="/partials/alerts/list" hx-target="#alerts-content" hx-swap="innerHTML">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    Alerts
                </a>
            </nav>
            
            <div class="p-4 border-t border-gray-700">
                <div class="flex items-center gap-3 text-sm">
                    <div class="status-dot status-healthy"></div>
                    <span class="text-gray-300">System Healthy</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Top Bar -->
            <header class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <h2 class="text-lg font-semibold" id="page-title">Overview</h2>
                    <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-gray-100 dark:bg-gray-800 rounded-lg text-sm">
                        <select id="time-range" class="bg-transparent border-none outline-none text-sm" hx-get="/partials/metrics/summary" hx-target="#metrics-summary" hx-trigger="change" hx-include="this">
                            <option value="1">Last Hour</option>
                            <option value="6">Last 6 Hours</option>
                            <option value="24" selected>Last 24 Hours</option>
                            <option value="168">Last 7 Days</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="location.reload()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="Refresh">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </button>
                    <a href="/docs" target="_blank" class="px-3 py-1.5 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition-colors">API Docs</a>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6">
                <!-- Metrics Summary Cards -->
                <section id="metrics-summary" hx-get="/partials/metrics/summary" hx-trigger="load, every 30s" hx-swap="innerHTML">
                    <!-- Loaded via HTMX -->
                </section>

                <!-- Charts Row -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
                        <h3 class="font-semibold mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Cost Trend
                        </h3>
                        <div class="chart-container" hx-get="/partials/charts/cost" hx-trigger="load, every 30s" hx-include="#time-range" hx-swap="innerHTML">
                            <canvas id="cost-chart"></canvas>
                        </div>
                    </div>
                    
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
                        <h3 class="font-semibold mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                            Latency (P50/P95/P99)
                        </h3>
                        <div class="chart-container" hx-get="/partials/charts/latency" hx-trigger="load, every 30s" hx-include="#time-range" hx-swap="innerHTML">
                            <canvas id="latency-chart"></canvas>
                        </div>
                    </div>
                    
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
                        <h3 class="font-semibold mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            Token Usage
                        </h3>
                        <div class="chart-container" hx-get="/partials/charts/tokens" hx-trigger="load, every 30s" hx-include="#time-range" hx-swap="innerHTML">
                            <canvas id="tokens-chart"></canvas>
                        </div>
                    </div>
                    
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
                        <h3 class="font-semibold mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                            </svg>
                            Error Rate
                        </h3>
                        <div class="chart-container" hx-get="/partials/charts/errors" hx-trigger="load, every 30s" hx-include="#time-range" hx-swap="innerHTML">
                            <canvas id="errors-chart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Model Breakdown & Recommendations -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-semibold flex items-center gap-2">
                                <svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                                </svg>
                                Model Breakdown
                            </h3>
                            <select class="px-2 py-1 text-sm border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700" hx-get="/partials/metrics/breakdown" hx-target="#metrics-content" hx-trigger="change" hx-include="this">
                                <option value="1">Last Hour</option>
                                <option value="6">Last 6 Hours</option>
                                <option value="24" selected>Last 24 Hours</option>
                                <option value="168">Last 7 Days</option>
                            </select>
                        </div>
                        <div id="metrics-content" class="overflow-x-auto scrollbar-thin" hx-get="/partials/metrics/breakdown" hx-trigger="load" hx-include="#time-range" hx-swap="innerHTML">
                            <!-- Loaded via HTMX -->
                        </div>
                    </div>
                    
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
                        <h3 class="font-semibold mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                            </svg>
                            Cost Optimization Recommendations
                        </h3>
                        <div id="recommendations-content" class="max-h-96 overflow-y-auto scrollbar-thin" hx-get="/partials/recommendations/list" hx-trigger="load, every 60s" hx-swap="innerHTML">
                            <!-- Loaded via HTMX -->
                        </div>
                    </div>
                </div>

                <!-- Alerts -->
                <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-4">
                    <h3 class="font-semibold mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                        Active Alerts
                    </h3>
                    <div id="alerts-content" class="max-h-64 overflow-y-auto scrollbar-thin" hx-get="/partials/alerts/list" hx-trigger="load, every 30s" hx-swap="innerHTML">
                        <!-- Loaded via HTMX -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Chart.js defaults
        Chart.defaults.font.family = "'JetBrains Mono', monospace";
        Chart.defaults.color = '#6b7280';
        Chart.defaults.plugins.legend.labels.usePointStyle = true;
        Chart.defaults.plugins.legend.labels.padding = 16;
        
        // Global chart instances for updates
        window.charts = {};
        
        // Initialize charts when partials load
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.target.id === 'cost-chart') {
                initCostChart(evt.target);
            } else if (evt.target.id === 'latency-chart') {
                initLatencyChart(evt.target);
            } else if (evt.target.id === 'tokens-chart') {
                initTokensChart(evt.target);
            } else if (evt.target.id === 'errors-chart') {
                initErrorsChart(evt.target);
            }
        });
        
        function initCostChart(canvas) {
            const ctx = canvas.getContext('2d');
            const data = JSON.parse(canvas.dataset.chartData || '[]');
            
            if (window.charts.cost) window.charts.cost.destroy();
            
            window.charts.cost = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => new Date(d.timestamp).toLocaleTimeString()),
                    datasets: [{
                        label: 'Cost (USD)',
                        data: data.map(d => d.value),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } },
                        y: { grid: { color: 'rgba(156, 163, 175, 0.1)' }, beginAtZero: true, ticks: { callback: v => '$' + v.toFixed(2) } }
                    }
                }
            });
        }
        
        function initLatencyChart(canvas) {
            const ctx = canvas.getContext('2d');
            const data = JSON.parse(canvas.dataset.chartData || '[]');
            
            if (window.charts.latency) window.charts.latency.destroy();
            
            window.charts.latency = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => new Date(d.timestamp).toLocaleTimeString()),
                    datasets: [
                        { label: 'P50', data: data.map(d => d.p50 || 0), borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: false, tension: 0.3, pointRadius: 0 },
                        { label: 'P95', data: data.map(d => d.p95 || 0), borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)', fill: false, tension: 0.3, pointRadius: 0 },
                        { label: 'P99', data: data.map(d => d.p99 || 0), borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: false, tension: 0.3, pointRadius: 0 },
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } },
                        y: { grid: { color: 'rgba(156, 163, 175, 0.1)' }, beginAtZero: true, ticks: { callback: v => v + 'ms' } }
                    }
                }
            });
        }
        
        function initTokensChart(canvas) {
            const ctx = canvas.getContext('2d');
            const data = JSON.parse(canvas.dataset.chartData || '[]');
            
            if (window.charts.tokens) window.charts.tokens.destroy();
            
            window.charts.tokens = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => new Date(d.timestamp).toLocaleTimeString()),
                    datasets: [{
                        label: 'Tokens',
                        data: data.map(d => d.value),
                        borderColor: '#8b5cf6',
                        backgroundColor: 'rgba(139, 92, 246, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } },
                        y: { grid: { color: 'rgba(156, 163, 175, 0.1)' }, beginAtZero: true, ticks: { callback: v => v.toLocaleString() } }
                    }
                }
            });
        }
        
        function initErrorsChart(canvas) {
            const ctx = canvas.getContext('2d');
            const data = JSON.parse(canvas.dataset.chartData || '[]');
            
            if (window.charts.errors) window.charts.errors.destroy();
            
            window.charts.errors = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => new Date(d.timestamp).toLocaleTimeString()),
                    datasets: [{
                        label: 'Error Rate',
                        data: data.map(d => d.value * 100),
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } },
                        y: { grid: { color: 'rgba(156, 163, 175, 0.1)' }, beginAtZero: true, max: 10, ticks: { callback: v => v + '%' } }
                    }
                }
            });
        }
        
        // Auto-refresh time range
        document.getElementById('time-range').addEventListener('change', function() {
            const value = this.value;
            document.querySelectorAll('[hx-include="#time-range"]').forEach(el => {
                htmx.trigger(el, 'load');
            });
        });
    </script>
</body>
</html>
